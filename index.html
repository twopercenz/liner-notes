<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Liner Notes</title>
<meta name="description" content="앨범, 싱글, EP, 곡에 대한 리뷰와 감상평, 해석을 기록하는 개인 음악 다이어리" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎧</text></svg>" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="noise-overlay"></div>

  <header class="site-header">
    <div class="wrap">
      <h1 class="logo">Liner Notes <span class="logo-emoji">🎧</span></h1>
      <p class="tagline">앨범 · 싱글 · EP · 곡에 대한 리뷰, 감상평, 해석 기록</p>
    </div>
  </header>

  <main class="wrap">
    <section class="toolbar">
      <div class="filters" id="filters">
        <button class="chip active" data-filter="all">전체</button>
        <button class="chip" data-filter="album">앨범</button>
        <button class="chip" data-filter="ep">EP</button>
        <button class="chip" data-filter="single">싱글</button>
        <button class="chip" data-filter="song">곡</button>
      </div>
      <div class="toolbar-right">
        <input type="search" id="search" placeholder="아티스트, 제목으로 검색" />
        <button id="new-entry-btn" class="btn btn-primary">+ 새 글쓰기</button>
      </div>
    </section>

    <p id="empty-state" class="empty-state hidden">
      아직 기록이 없어요. 첫 리뷰를 남겨보세요 🎙️
    </p>

    <section id="entry-grid" class="entry-grid"></section>
  </main>

  <!-- 작성/수정 모달 -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">새 글쓰기</h2>
        <button id="modal-close" class="icon-btn" aria-label="닫기">✕</button>
      </div>

      <form id="entry-form">
        <input type="hidden" id="entry-id" />

        <div class="form-row">
          <div class="form-group">
            <label for="type">분류</label>
            <select id="type" required>
              <option value="album">앨범</option>
              <option value="ep">EP</option>
              <option value="single">싱글</option>
              <option value="song">곡</option>
            </select>
          </div>
          <div class="form-group">
            <label for="year">발매연도</label>
            <input type="number" id="year" placeholder="예: 2023" min="1900" max="2100" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="artist">아티스트</label>
            <input type="text" id="artist" required placeholder="예: 실리카겔" />
          </div>
          <div class="form-group">
            <label for="title">제목</label>
            <input type="text" id="title" required placeholder="예: Machine Boy" />
          </div>
        </div>

        <div class="form-group">
          <label for="cover">커버 이미지 URL (선택)</label>
          <input type="url" id="cover" placeholder="https://..." />
        </div>

        <div class="form-group">
          <label>별점</label>
          <div id="rating-input" class="rating-input" data-value="0">
            <span class="star" data-value="1">★</span>
            <span class="star" data-value="2">★</span>
            <span class="star" data-value="3">★</span>
            <span class="star" data-value="4">★</span>
            <span class="star" data-value="5">★</span>
          </div>
        </div>

        <div class="form-group">
          <label for="review">감상평 <span class="hint">(짧은 한줄평이나 전체적인 느낌)</span></label>
          <textarea id="review" rows="3" placeholder="이 앨범/곡을 듣고 느낀 점을 자유롭게 적어보세요"></textarea>
        </div>

        <div class="form-group">
          <label for="interpretation">해석 <span class="hint">(가사, 컨셉, 상징 등 깊이 있는 해석)</span></label>
          <textarea id="interpretation" rows="5" placeholder="가사의 의미, 앨범의 컨셉, 사운드가 표현하는 것 등을 해석해보세요"></textarea>
        </div>

        <div class="modal-actions">
          <button type="button" id="delete-btn" class="btn btn-danger hidden">삭제</button>
          <div class="modal-actions-right">
            <button type="button" id="cancel-btn" class="btn">취소</button>
            <button type="submit" class="btn btn-primary">저장</button>
          </div>
        </div>
      </form>
    </div>
  </div>

  <!-- 상세 보기 모달 -->
  <div id="detail-backdrop" class="modal-backdrop hidden">
    <div class="modal detail-modal">
      <div class="modal-header">
        <h2 id="detail-title">제목</h2>
        <button id="detail-close" class="icon-btn" aria-label="닫기">✕</button>
      </div>
      <div id="detail-body" class="detail-body"></div>
      <div class="modal-actions">
        <button id="detail-edit-btn" class="btn btn-primary">수정하기</button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>Liner Notes — 나만의 음악 해석 노트. 데이터는 이 브라우저에만 저장됩니다.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
